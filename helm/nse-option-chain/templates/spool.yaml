{{- if and .Values.collector.enabled (not .Values.collector.spool.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nifty.fullname" . }}-spool
  labels:
    {{- include "nifty.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.collector.spool.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.collector.spool.storage }}
{{- end }}
