{{- if and (not .Values.postgresql.enabled) (not .Values.credentials.existingSecret) }}
{{- fail "credentials.existingSecret is required for an external PostgreSQL server" }}
{{- end }}
{{- if not .Values.credentials.existingSecret }}
{{- $name := include "nifty.secret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if $existing }}
{{- range $key := list "POSTGRES_PASSWORD" "COLLECTOR_PASSWORD" "API_PASSWORD" }}
{{- if not (hasKey $existing.data $key) }}
{{- fail (printf "Retained credential Secret is missing %s; restore the original credentials" $key) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "nifty.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := list "POSTGRES_PASSWORD" "COLLECTOR_PASSWORD" "API_PASSWORD" }}
  {{ $key }}: {{ if and $existing (hasKey $existing.data $key) }}{{ index $existing.data $key | quote }}{{ else }}{{ randAlphaNum 48 | b64enc | quote }}{{ end }}
  {{- end }}
{{- end }}
