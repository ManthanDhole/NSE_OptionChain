apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nifty.fullname" . }}-runtime
  labels:
    {{- include "nifty.labels" . | nindent 4 }}
data:
  # One token per render, shared through env references. A reinstall cannot reuse
  # an old revision-1 marker left in the retained database.
  MIGRATION_TOKEN: {{ printf "%s-r%d-%s" .Release.Name .Release.Revision (randAlphaNum 16) | quote }}
