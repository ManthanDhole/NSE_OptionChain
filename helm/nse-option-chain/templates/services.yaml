apiVersion: v1
kind: Service
metadata:
  name: {{ include "nifty.fullname" . }}-ui
  labels:
    {{- include "nifty.labels" . | nindent 4 }}
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    {{- include "nifty.selector" . | nindent 4 }}
    app.kubernetes.io/component: ui
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nifty.fullname" . }}-api
  labels:
    {{- include "nifty.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "nifty.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
{{- if .Values.postgresql.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nifty.fullname" . }}-postgres
  labels:
    {{- include "nifty.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "nifty.selector" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
