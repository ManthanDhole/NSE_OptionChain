apiVersion: v1
kind: Pod
metadata:
  name: {{ include "nifty.fullname" . }}-test
  labels:
    {{- include "nifty.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    {{- include "nifty.podSecurity" . | nindent 4 }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: verify-ui-api-database
      image: {{ printf "%s:%s" .Values.images.ui.repository .Values.images.ui.tag | quote }}
      imagePullPolicy: {{ .Values.images.ui.pullPolicy }}
      securityContext:
        {{- include "nifty.security" . | nindent 8 }}
      env:
        - name: UI_URL
          value: {{ printf "http://%s-ui:%v" (include "nifty.fullname" .) .Values.ui.service.port | quote }}
      command:
        - python
        - -c
        - |
          import json, os, urllib.request
          url=os.environ['UI_URL']
          assert b'NIFTY' in urllib.request.urlopen(url, timeout=10).read()
          assert json.load(urllib.request.urlopen(url+'/health', timeout=10))['status']=='ok'
          state=json.load(urllib.request.urlopen(url+'/api/state', timeout=10))
          assert 'snapshot' in state and 'refresh_seconds' in state
          print('UI Service -> API Service -> PostgreSQL verified')
      resources:
        requests: {cpu: 25m, memory: 32Mi}
        limits: {cpu: 250m, memory: 128Mi}
